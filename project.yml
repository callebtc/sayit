name: SayIt

options:
  bundleIdPrefix: sh.sayit
  deploymentTarget:
    macOS: "15.0"
  generateEmptyDirectories: true
  groupSortPosition: top

packages:
  MLXAudio:
    url: https://github.com/Blaizzy/mlx-audio-swift.git
    exactVersion: 0.1.3
  OpenAPIRuntime:
    url: https://github.com/apple/swift-openapi-runtime
    from: 1.8.2
  Hummingbird:
    url: https://github.com/hummingbird-project/hummingbird.git
    exactVersion: 2.22.0
  OpenAPIHummingbird:
    url: https://github.com/swift-server/swift-openapi-hummingbird
    exactVersion: 2.0.1
  ArgumentParser:
    url: https://github.com/apple/swift-argument-parser
    exactVersion: 1.8.2
  Yams:
    url: https://github.com/jpsim/Yams
    exactVersion: 6.2.2

settings:
  base:
    ARCHS: arm64
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_INJECT_BASE_ENTITLEMENTS: false
    CURRENT_PROJECT_VERSION: 7
    DEAD_CODE_STRIPPING: true
    DEVELOPMENT_TEAM: D7AHD3GLH6
    ENABLE_APP_SANDBOX: true
    ENABLE_HARDENED_RUNTIME: true
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    MARKETING_VERSION: "0.1.3"
    OTHER_SWIFT_FLAGS: "$(inherited) $(SAYIT_LOCAL_SWIFT_FLAG)"
    SAYIT_APP_BUNDLE_IDENTIFIER: sh.sayit.mac
    SAYIT_APP_DISPLAY_NAME: Say It
    SAYIT_SELECTION_BUNDLE_IDENTIFIER: sh.sayit.mac.selection-helper
    SAYIT_SELECTION_DISPLAY_NAME: Say It Selected-Text Helper
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_TREAT_WARNINGS_AS_ERRORS: true
    SWIFT_VERSION: "6.0"
  configs:
    Debug:
      SAYIT_APP_BUNDLE_IDENTIFIER: sh.sayit.mac.local
      SAYIT_APP_DISPLAY_NAME: Say It Local
      SAYIT_SELECTION_BUNDLE_IDENTIFIER: sh.sayit.mac.selection-helper.local
      SAYIT_SELECTION_DISPLAY_NAME: Say It Local Selected-Text Helper
    Release:
      COPY_PHASE_STRIP: true
      DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
      DEPLOYMENT_POSTPROCESSING: true
      STRIP_INSTALLED_PRODUCT: true
      STRIP_STYLE: non-global
      SWIFT_SERIALIZE_DEBUGGING_OPTIONS: false

targets:
  SayItProtocol:
    type: framework
    platform: macOS
    sources:
      - path: Sources/SayItProtocol
    settings:
      base:
        DEFINES_MODULE: true
        GENERATE_INFOPLIST_FILE: true
        PRODUCT_BUNDLE_IDENTIFIER: sh.sayit.mac.protocol
        PRODUCT_NAME: SayItProtocol
        SKIP_INSTALL: true

  SayItCore:
    type: framework
    platform: macOS
    sources:
      - path: Sources/SayItCore
        excludes:
          - Resources
      - path: Sources/SayItCore/Resources
        buildPhase: resources
    settings:
      base:
        DEFINES_MODULE: true
        GENERATE_INFOPLIST_FILE: true
        PRODUCT_BUNDLE_IDENTIFIER: sh.sayit.mac.core
        PRODUCT_NAME: SayItCore
        SKIP_INSTALL: true

  SayItBackend:
    type: framework
    platform: macOS
    sources:
      - path: Sources/SayItBackend
    dependencies:
      - target: SayItCore
      - target: SayItProtocol
      - package: MLXAudio
        product: MLXAudioCore
      - package: MLXAudio
        product: MLXAudioTTS
    settings:
      base:
        DEFINES_MODULE: true
        GENERATE_INFOPLIST_FILE: true
        PRODUCT_BUNDLE_IDENTIFIER: sh.sayit.mac.backend
        PRODUCT_NAME: SayItBackend
        SKIP_INSTALL: true

  SayItXPC:
    type: framework
    platform: macOS
    sources:
      - path: Sources/SayItXPC
    dependencies:
      - target: SayItProtocol
      - sdk: AppKit.framework
      - sdk: Security.framework
    settings:
      base:
        DEFINES_MODULE: true
        GENERATE_INFOPLIST_FILE: true
        PRODUCT_BUNDLE_IDENTIFIER: sh.sayit.mac.xpc
        PRODUCT_NAME: SayItXPC
        SKIP_INSTALL: true

  SayItHTTP:
    type: framework
    platform: macOS
    sources:
      - path: Sources/SayItHTTP
    dependencies:
      - target: SayItBackend
      - target: SayItProtocol
      - package: Hummingbird
        product: Hummingbird
      - package: OpenAPIRuntime
        product: OpenAPIRuntime
      - package: OpenAPIHummingbird
        product: OpenAPIHummingbird
      - package: Yams
        product: Yams
    settings:
      base:
        DEFINES_MODULE: true
        GENERATE_INFOPLIST_FILE: true
        PRODUCT_BUNDLE_IDENTIFIER: sh.sayit.mac.http
        PRODUCT_NAME: SayItHTTP
        SKIP_INSTALL: true

  SayItAgent:
    type: application
    platform: macOS
    sources:
      - path: Sources/SayItAgent
    entitlements:
      path: Config/SayItAgent.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.application-groups:
          - group.sh.sayit.mac
        com.apple.security.network.client: true
        com.apple.security.network.server: true
    dependencies:
      - target: SayItBackend
      - target: SayItCore
      - target: SayItHTTP
      - target: SayItProtocol
      - target: SayItXPC
    settings:
      base:
        CODE_SIGN_IDENTITY: "$(SAYIT_SIGN_IDENTITY)"
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_ENTITLEMENTS: Config/SayItAgent.entitlements
        EXECUTABLE_NAME: SayItAgent
        GENERATE_INFOPLIST_FILE: true
        INFOPLIST_KEY_CFBundleDisplayName: Say It Background Service
        INFOPLIST_KEY_LSBackgroundOnly: true
        INFOPLIST_KEY_LSMinimumSystemVersion: "$(MACOSX_DEPLOYMENT_TARGET)"
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../../../../../Frameworks"
        PRODUCT_BUNDLE_IDENTIFIER: sh.sayit.mac.agent
        PRODUCT_NAME: SayItAgent
        PROVISIONING_PROFILE_SPECIFIER: Say It Agent Developer ID
        SKIP_INSTALL: true

  SayItSelectionAgent:
    type: tool
    platform: macOS
    sources:
      - path: Sources/SayItSelectionAgent
    dependencies:
      - target: SayItProtocol
      - target: SayItXPC
      - sdk: ApplicationServices.framework
      - sdk: AppKit.framework
    settings:
      base:
        CODE_SIGNING_ALLOWED: false
        CREATE_INFOPLIST_SECTION_IN_BINARY: true
        ENABLE_APP_SANDBOX: false
        GENERATE_INFOPLIST_FILE: true
        INFOPLIST_KEY_CFBundleDisplayName: "$(SAYIT_SELECTION_DISPLAY_NAME)"
        INFOPLIST_KEY_LSBackgroundOnly: true
        INFOPLIST_KEY_LSMinimumSystemVersion: "$(MACOSX_DEPLOYMENT_TARGET)"
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
        PRODUCT_BUNDLE_IDENTIFIER: "$(SAYIT_SELECTION_BUNDLE_IDENTIFIER)"
        PRODUCT_NAME: SayItSelectionAgent

  SayItCLI:
    type: application
    platform: macOS
    sources:
      - path: Sources/SayItCLI
    entitlements:
      path: Config/SayItCLI.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.application-groups:
          - group.sh.sayit.mac
    dependencies:
      - target: SayItProtocol
      - target: SayItXPC
      - package: ArgumentParser
        product: ArgumentParser
    settings:
      base:
        CODE_SIGN_IDENTITY: "$(SAYIT_SIGN_IDENTITY)"
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_ENTITLEMENTS: Config/SayItCLI.entitlements
        EXECUTABLE_NAME: sayit
        GENERATE_INFOPLIST_FILE: true
        INFOPLIST_KEY_CFBundleDisplayName: Say It CLI
        INFOPLIST_KEY_LSBackgroundOnly: true
        INFOPLIST_KEY_LSMinimumSystemVersion: "$(MACOSX_DEPLOYMENT_TARGET)"
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../../../../Frameworks"
        PRODUCT_BUNDLE_IDENTIFIER: sh.sayit.mac.cli
        PRODUCT_NAME: SayItCLI
        PROVISIONING_PROFILE_SPECIFIER: Say It CLI Developer ID
        SKIP_INSTALL: true

  SayIt:
    type: application
    platform: macOS
    sources:
      - path: Sources/SayIt
        excludes:
          - Resources
      - path: Sources/SayIt/Resources
        buildPhase: resources
    info:
      path: Config/Info.plist
      properties:
        CFBundleDisplayName: "$(SAYIT_APP_DISPLAY_NAME)"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSMinimumSystemVersion: "$(MACOSX_DEPLOYMENT_TARGET)"
        LSUIElement: true
        NSMicrophoneUsageDescription: Say It uses the microphone only when you choose to record a local voice reference.
        SayItUpdateAPIURL: "$(SAYIT_UPDATE_API_URL)"
        NSServices:
          - NSMenuItem:
              default: Say It
            NSMessage: saySelectedText
            NSPortName: SayIt
            NSRequiredContext: {}
            NSRestricted: false
            NSReturnTypes: []
            NSServiceCategory: public.text
            NSSendTypes:
              - public.utf8-plain-text
              - NSStringPboardType
              - public.html
              - public.rtf
              - public.rtfd
        NSHumanReadableCopyright: "Copyright © 2026 Say It"
    entitlements:
      path: Config/SayIt.entitlements
      properties:
        com.apple.security.application-groups:
          - group.sh.sayit.mac
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.device.audio-input: true
        com.apple.security.network.client: true
    dependencies:
      - target: SayItBackend
        embed: true
      - target: SayItCore
        embed: true
      - target: SayItProtocol
        embed: true
      - target: SayItXPC
        embed: true
      - target: SayItHTTP
        embed: true
      - target: SayItAgent
        link: false
        embed: false
      - target: SayItSelectionAgent
        link: false
        embed: false
      - target: SayItCLI
        link: false
        embed: false
      - package: MLXAudio
        product: MLXAudioCore
      - package: MLXAudio
        product: MLXAudioTTS
      - package: ArgumentParser
        product: ArgumentParser
    settings:
      base:
        CODE_SIGN_IDENTITY: "$(SAYIT_SIGN_IDENTITY)"
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_ENTITLEMENTS: Config/SayIt.entitlements
        ENABLE_APP_SANDBOX: false
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        EXECUTABLE_NAME: SayIt
        INFOPLIST_FILE: Config/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: "$(SAYIT_APP_BUNDLE_IDENTIFIER)"
        PRODUCT_NAME: SayIt
        PROVISIONING_PROFILE_SPECIFIER: Say It Developer ID
    postBuildScripts:
      - name: Embed Background Service and CLI
        basedOnDependencyAnalysis: false
        script: |
          set -euo pipefail
          service_dir="${TARGET_BUILD_DIR}/${CONTENTS_FOLDER_PATH}/Library/LaunchServices"
          agent_dir="${TARGET_BUILD_DIR}/${CONTENTS_FOLDER_PATH}/Library/LaunchAgents"
          cli_dir="${TARGET_BUILD_DIR}/${CONTENTS_FOLDER_PATH}/Helpers"
          timestamp_option=
          if [[ "${SAYIT_DISABLE_SECURE_TIMESTAMP:-NO}" == "YES" ]]; then
            timestamp_option=--timestamp=none
          fi
          mkdir -p "${service_dir}" "${agent_dir}" "${cli_dir}"
          rm -f \
            "${service_dir}/SayItAgent" \
            "${service_dir}/SayItSelectionAgent" \
            "${cli_dir}/SayItSelectionAgent" \
            "${cli_dir}/sayit" \
            "${agent_dir}/com.sayit.mac.agent.plist" \
            "${agent_dir}/com.sayit.mac.selection.plist" \
            "${agent_dir}/sh.sayit.mac.selection.plist" \
            "${agent_dir}/sh.sayit.mac.selection-helper.plist"
          rm -rf \
            "${service_dir}/SayItAgent.app" \
            "${cli_dir}/SayItCLI.app"
          ditto "${BUILT_PRODUCTS_DIR}/SayItAgent.app" "${service_dir}/SayItAgent.app"
          ditto "${BUILT_PRODUCTS_DIR}/SayItSelectionAgent" "${cli_dir}/SayItSelectionAgent"
          if [[ -n "${SAYIT_SELECTION_SIGN_IDENTITY:-}" ]]; then
            /usr/bin/codesign \
              --force \
              --sign "${SAYIT_SELECTION_SIGN_IDENTITY}" \
              ${timestamp_option} \
              --options runtime \
              --identifier "${SAYIT_SELECTION_BUNDLE_IDENTIFIER}" \
              "${cli_dir}/SayItSelectionAgent"
          fi
          ditto "${BUILT_PRODUCTS_DIR}/mlx-swift_Cmlx.bundle" "${service_dir}/mlx-swift_Cmlx.bundle"
          ditto "${BUILT_PRODUCTS_DIR}/SayItCLI.app" "${cli_dir}/SayItCLI.app"
          ln -s "SayItCLI.app/Contents/MacOS/sayit" "${cli_dir}/sayit"
          ditto "${SRCROOT}/Config/sh.sayit.mac.agent.plist" "${agent_dir}/sh.sayit.mac.agent.plist"

          # Compiled Swift module metadata is only needed by developers linking
          # against a framework. Removing it from the distributed app also
          # prevents local source and package-cache paths from leaking.
          app_dir="${TARGET_BUILD_DIR}/${WRAPPER_NAME}"
          find "${app_dir}" \
            -type d \
            -name '*.swiftmodule' \
            -prune \
            -exec rm -rf {} +

          # Embedded code is signed before this post-build phase. If this is a
          # certificate-signed build, restore those nested signatures after
          # removing their development metadata; Xcode signs the outer app last.
          if [[ "${CODE_SIGNING_ALLOWED:-NO}" == "YES" \
              && -n "${EXPANDED_CODE_SIGN_IDENTITY:-}" ]]; then
            find "${app_dir}" \
              -type f \
              -name '*.dylib' \
              -exec /usr/bin/codesign \
                --force \
                --sign "${EXPANDED_CODE_SIGN_IDENTITY}" \
                ${timestamp_option} \
                --preserve-metadata=identifier,entitlements,requirements,flags,runtime \
                {} \;

            find "${app_dir}" \
              -type d \
              -name '*.framework' \
              -exec /usr/bin/codesign \
                --force \
                --sign "${EXPANDED_CODE_SIGN_IDENTITY}" \
                ${timestamp_option} \
                --preserve-metadata=identifier,entitlements,requirements,flags,runtime \
                {} \;

            find "${app_dir}/Contents" \
              -type d \
              -name '*.app' \
              -exec /usr/bin/codesign \
                --force \
                --sign "${EXPANDED_CODE_SIGN_IDENTITY}" \
                ${timestamp_option} \
                --preserve-metadata=identifier,entitlements,requirements,flags,runtime \
                {} \;
          fi

  SayItCoreTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/SayItCoreTests
        excludes:
          - Fixtures
      - path: Tests/SayItCoreTests/Fixtures
        buildPhase: resources
    dependencies:
      - target: SayItCore
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
        PRODUCT_BUNDLE_IDENTIFIER: sh.sayit.mac.core-tests

  SayItProtocolTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/SayItProtocolTests
    dependencies:
      - target: SayItProtocol
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
        PRODUCT_BUNDLE_IDENTIFIER: sh.sayit.mac.protocol-tests

  SayItSelectionAgentTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/SayItSelectionAgentTests
    dependencies:
      - target: SayItProtocol
      - target: SayItXPC
      - sdk: AppKit.framework
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
        PRODUCT_BUNDLE_IDENTIFIER: sh.sayit.mac.selection-agent-tests

  SayItBackendTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/SayItBackendTests
    dependencies:
      - target: SayItBackend
      - target: SayItProtocol
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
        PRODUCT_BUNDLE_IDENTIFIER: sh.sayit.mac.backend-tests

  SayItHTTPTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/SayItHTTPTests
    dependencies:
      - target: SayItCore
      - target: SayItBackend
      - target: SayItHTTP
      - target: SayItProtocol
      - package: Hummingbird
        product: HummingbirdTesting
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
        PRODUCT_BUNDLE_IDENTIFIER: sh.sayit.mac.http-tests

  SayItUpdateTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/SayItUpdateTests
      - path: Sources/SayIt/Updates
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
        PRODUCT_BUNDLE_IDENTIFIER: sh.sayit.mac.update-tests

  SayItUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: Tests/SayItUITests
    dependencies:
      - target: SayIt
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
        PRODUCT_BUNDLE_IDENTIFIER: sh.sayit.mac.ui-tests
        TEST_TARGET_NAME: SayIt

schemes:
  SayItBackendTests:
    build:
      targets:
        SayItBackendTests: [test]
    test:
      config: Debug
      targets:
        - SayItBackendTests
      environmentVariables:
        SAYIT_MODEL_AUDIT_ALL_VOICES: "$(SAYIT_MODEL_AUDIT_ALL_VOICES)"
        SAYIT_MODEL_AUDIT_ID: "$(SAYIT_MODEL_AUDIT_ID)"
        SAYIT_MODEL_AUDIT_LANGUAGE: "$(SAYIT_MODEL_AUDIT_LANGUAGE)"
        SAYIT_MODEL_AUDIT_OUTPUT: "$(SAYIT_MODEL_AUDIT_OUTPUT)"
        SAYIT_MODEL_AUDIT_REFERENCE: "$(SAYIT_MODEL_AUDIT_REFERENCE)"
        SAYIT_MODEL_AUDIT_REFERENCE_TEXT: "$(SAYIT_MODEL_AUDIT_REFERENCE_TEXT)"
        SAYIT_MODEL_AUDIT_ROOT: "$(SAYIT_MODEL_AUDIT_ROOT)"
        SAYIT_MODEL_AUDIT_TEXT: "$(SAYIT_MODEL_AUDIT_TEXT)"
        SAYIT_MODEL_AUDIT_VOICE: "$(SAYIT_MODEL_AUDIT_VOICE)"
        SAYIT_MODEL_AUDIT_VOICE_DESCRIPTION: "$(SAYIT_MODEL_AUDIT_VOICE_DESCRIPTION)"

  SayIt:
    build:
      targets:
        SayIt: all
        SayItCoreTests: [test]
        SayItProtocolTests: [test]
        SayItSelectionAgentTests: [test]
        SayItBackendTests: [test]
        SayItHTTPTests: [test]
        SayItUpdateTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - SayItCoreTests
        - SayItProtocolTests
        - SayItSelectionAgentTests
        - SayItBackendTests
        - SayItHTTPTests
        - SayItUpdateTests
        - SayItUITests
    archive:
      config: Release

  SayItUpdateTests:
    build:
      targets:
        SayItUpdateTests: [test]
    test:
      config: Debug
      targets:
        - SayItUpdateTests
