name: SayIt

options:
  bundleIdPrefix: sh.sayit
  deploymentTarget:
    macOS: "15.0"
  generateEmptyDirectories: true
  groupSortPosition: top

packages:
  MLXAudio:
    url: https://github.com/Blaizzy/mlx-audio-swift.git
    exactVersion: 0.1.3
  OpenAPIRuntime:
    url: https://github.com/apple/swift-openapi-runtime
    from: 1.8.2
  Hummingbird:
    url: https://github.com/hummingbird-project/hummingbird.git
    exactVersion: 2.22.0
  OpenAPIHummingbird:
    url: https://github.com/swift-server/swift-openapi-hummingbird
    exactVersion: 2.0.1
  ArgumentParser:
    url: https://github.com/apple/swift-argument-parser
    exactVersion: 1.8.2
  Yams:
    url: https://github.com/jpsim/Yams
    exactVersion: 6.2.2

settings:
  base:
    ARCHS: arm64
    CODE_SIGN_INJECT_BASE_ENTITLEMENTS: false
    DEAD_CODE_STRIPPING: true
    ENABLE_APP_SANDBOX: true
    ENABLE_HARDENED_RUNTIME: true
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    OTHER_SWIFT_FLAGS: "$(inherited) $(SAYIT_LOCAL_SWIFT_FLAG)"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_TREAT_WARNINGS_AS_ERRORS: true
    SWIFT_VERSION: "6.0"

targets:
  SayItProtocol:
    type: framework
    platform: macOS
    sources:
      - path: Sources/SayItProtocol
    settings:
      base:
        DEFINES_MODULE: true
        GENERATE_INFOPLIST_FILE: true
        PRODUCT_BUNDLE_IDENTIFIER: sh.sayit.mac.protocol
        PRODUCT_NAME: SayItProtocol
        SKIP_INSTALL: true

  SayItCore:
    type: framework
    platform: macOS
    sources:
      - path: Sources/SayItCore
        excludes:
          - Resources
      - path: Sources/SayItCore/Resources
        buildPhase: resources
    settings:
      base:
        DEFINES_MODULE: true
        GENERATE_INFOPLIST_FILE: true
        PRODUCT_BUNDLE_IDENTIFIER: sh.sayit.mac.core
        PRODUCT_NAME: SayItCore
        SKIP_INSTALL: true

  SayItBackend:
    type: framework
    platform: macOS
    sources:
      - path: Sources/SayItBackend
    dependencies:
      - target: SayItCore
      - target: SayItProtocol
      - package: MLXAudio
        product: MLXAudioCore
      - package: MLXAudio
        product: MLXAudioTTS
    settings:
      base:
        DEFINES_MODULE: true
        GENERATE_INFOPLIST_FILE: true
        PRODUCT_BUNDLE_IDENTIFIER: sh.sayit.mac.backend
        PRODUCT_NAME: SayItBackend
        SKIP_INSTALL: true

  SayItXPC:
    type: framework
    platform: macOS
    sources:
      - path: Sources/SayItXPC
    dependencies:
      - target: SayItProtocol
      - sdk: Security.framework
    settings:
      base:
        DEFINES_MODULE: true
        GENERATE_INFOPLIST_FILE: true
        PRODUCT_BUNDLE_IDENTIFIER: sh.sayit.mac.xpc
        PRODUCT_NAME: SayItXPC
        SKIP_INSTALL: true

  SayItHTTP:
    type: framework
    platform: macOS
    sources:
      - path: Sources/SayItHTTP
    dependencies:
      - target: SayItBackend
      - target: SayItProtocol
      - package: Hummingbird
        product: Hummingbird
      - package: OpenAPIRuntime
        product: OpenAPIRuntime
      - package: OpenAPIHummingbird
        product: OpenAPIHummingbird
      - package: Yams
        product: Yams
    settings:
      base:
        DEFINES_MODULE: true
        GENERATE_INFOPLIST_FILE: true
        PRODUCT_BUNDLE_IDENTIFIER: sh.sayit.mac.http
        PRODUCT_NAME: SayItHTTP
        SKIP_INSTALL: true

  SayItAgent:
    type: tool
    platform: macOS
    sources:
      - path: Sources/SayItAgent
    entitlements:
      path: Config/SayItAgent.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.application-groups:
          - group.sh.sayit.mac
        com.apple.security.network.client: true
        com.apple.security.network.server: true
    dependencies:
      - target: SayItBackend
      - target: SayItCore
      - target: SayItHTTP
      - target: SayItProtocol
      - target: SayItXPC
    settings:
      base:
        CODE_SIGN_ENTITLEMENTS: Config/SayItAgent.entitlements
        GENERATE_INFOPLIST_FILE: true
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../../Frameworks"
        PRODUCT_BUNDLE_IDENTIFIER: sh.sayit.mac.agent
        PRODUCT_NAME: SayItAgent

  SayItSelectionAgent:
    type: tool
    platform: macOS
    sources:
      - path: Sources/SayItSelectionAgent
    dependencies:
      - target: SayItProtocol
      - target: SayItXPC
      - sdk: ApplicationServices.framework
      - sdk: AppKit.framework
    settings:
      base:
        ENABLE_APP_SANDBOX: false
        GENERATE_INFOPLIST_FILE: true
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../../Frameworks"
        PRODUCT_BUNDLE_IDENTIFIER: sh.sayit.mac.selection
        PRODUCT_NAME: SayItSelectionAgent

  SayItCLI:
    type: tool
    platform: macOS
    sources:
      - path: Sources/SayItCLI
    entitlements:
      path: Config/SayItCLI.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.application-groups:
          - group.sh.sayit.mac
        sh.sayit.client: true
    dependencies:
      - target: SayItProtocol
      - target: SayItXPC
      - package: ArgumentParser
        product: ArgumentParser
    settings:
      base:
        CODE_SIGN_ENTITLEMENTS: Config/SayItCLI.entitlements
        CONFIGURATION_BUILD_DIR: "$(BUILD_DIR)/$(CONFIGURATION)$(EFFECTIVE_PLATFORM_NAME)/SayItCLIProducts"
        FRAMEWORKS_FOLDER_PATH: SayItCLIFrameworks
        FRAMEWORK_SEARCH_PATHS: "$(inherited) $(BUILD_DIR)/$(CONFIGURATION)$(EFFECTIVE_PLATFORM_NAME) $(BUILD_DIR)/$(CONFIGURATION)$(EFFECTIVE_PLATFORM_NAME)/PackageFrameworks"
        GENERATE_INFOPLIST_FILE: true
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
        LIBRARY_SEARCH_PATHS: "$(inherited) $(BUILD_DIR)/$(CONFIGURATION)$(EFFECTIVE_PLATFORM_NAME)"
        PRODUCT_BUNDLE_IDENTIFIER: sh.sayit.mac.cli
        PRODUCT_NAME: sayit
        SWIFT_INCLUDE_PATHS: "$(inherited) $(BUILD_DIR)/$(CONFIGURATION)$(EFFECTIVE_PLATFORM_NAME)"

  SayIt:
    type: application
    platform: macOS
    sources:
      - path: Sources/SayIt
        excludes:
          - Resources
      - path: Sources/SayIt/Resources
        buildPhase: resources
    info:
      path: Config/Info.plist
      properties:
        CFBundleDisplayName: Say It
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSMinimumSystemVersion: "$(MACOSX_DEPLOYMENT_TARGET)"
        LSUIElement: true
        NSMicrophoneUsageDescription: Say It uses the microphone only when you choose to record a local voice reference.
        NSServices:
          - NSMenuItem:
              default: Say It
            NSMessage: saySelectedText
            NSPortName: SayIt
            NSRequiredContext: {}
            NSRestricted: false
            NSReturnTypes: []
            NSServiceCategory: public.text
            NSSendTypes:
              - public.utf8-plain-text
              - NSStringPboardType
              - public.html
              - public.rtf
              - public.rtfd
        NSHumanReadableCopyright: "Copyright © 2026 Say It"
    entitlements:
      path: Config/SayIt.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.application-groups:
          - group.sh.sayit.mac
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.device.audio-input: true
        com.apple.security.network.client: true
        sh.sayit.client: true
    dependencies:
      - target: SayItBackend
        embed: true
      - target: SayItCore
        embed: true
      - target: SayItProtocol
        embed: true
      - target: SayItXPC
        embed: true
      - target: SayItHTTP
        embed: true
      - target: SayItAgent
        link: false
        embed: false
      - target: SayItSelectionAgent
        link: false
        embed: false
      - target: SayItCLI
        link: false
        embed: false
      - package: MLXAudio
        product: MLXAudioCore
      - package: MLXAudio
        product: MLXAudioTTS
      - package: ArgumentParser
        product: ArgumentParser
    settings:
      base:
        CODE_SIGN_ENTITLEMENTS: Config/SayIt.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        EXECUTABLE_NAME: SayIt
        INFOPLIST_FILE: Config/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: sh.sayit.mac
        PRODUCT_NAME: SayIt
    postBuildScripts:
      - name: Embed Background Service and CLI
        basedOnDependencyAnalysis: false
        script: |
          set -euo pipefail
          service_dir="${TARGET_BUILD_DIR}/${CONTENTS_FOLDER_PATH}/Library/LaunchServices"
          agent_dir="${TARGET_BUILD_DIR}/${CONTENTS_FOLDER_PATH}/Library/LaunchAgents"
          cli_dir="${TARGET_BUILD_DIR}/${CONTENTS_FOLDER_PATH}/Helpers"
          platform_suffix="${EFFECTIVE_PLATFORM_NAME:-}"
          cli_products="${BUILD_DIR}/${CONFIGURATION}${platform_suffix}/SayItCLIProducts"
          mkdir -p "${service_dir}" "${agent_dir}" "${cli_dir}"
          rm -f \
            "${agent_dir}/com.sayit.mac.agent.plist" \
            "${agent_dir}/com.sayit.mac.selection.plist"
          ditto "${BUILT_PRODUCTS_DIR}/SayItAgent" "${service_dir}/SayItAgent"
          ditto "${BUILT_PRODUCTS_DIR}/SayItSelectionAgent" "${service_dir}/SayItSelectionAgent"
          if [[ -n "${SAYIT_SELECTION_SIGN_IDENTITY:-}" ]]; then
            /usr/bin/codesign \
              --force \
              --sign "${SAYIT_SELECTION_SIGN_IDENTITY}" \
              --identifier sh.sayit.mac.selection \
              "${service_dir}/SayItSelectionAgent"
          fi
          ditto "${BUILT_PRODUCTS_DIR}/mlx-swift_Cmlx.bundle" "${service_dir}/mlx-swift_Cmlx.bundle"
          ditto "${cli_products}/sayit" "${cli_dir}/sayit"
          ditto "${SRCROOT}/Config/sh.sayit.mac.agent.plist" "${agent_dir}/sh.sayit.mac.agent.plist"
          ditto "${SRCROOT}/Config/sh.sayit.mac.selection.plist" "${agent_dir}/sh.sayit.mac.selection.plist"

  SayItCoreTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/SayItCoreTests
        excludes:
          - Fixtures
      - path: Tests/SayItCoreTests/Fixtures
        buildPhase: resources
    dependencies:
      - target: SayItCore
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
        PRODUCT_BUNDLE_IDENTIFIER: sh.sayit.mac.core-tests

  SayItProtocolTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/SayItProtocolTests
    dependencies:
      - target: SayItProtocol
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
        PRODUCT_BUNDLE_IDENTIFIER: sh.sayit.mac.protocol-tests

  SayItBackendTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/SayItBackendTests
    dependencies:
      - target: SayItBackend
      - target: SayItProtocol
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
        PRODUCT_BUNDLE_IDENTIFIER: sh.sayit.mac.backend-tests

  SayItHTTPTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/SayItHTTPTests
    dependencies:
      - target: SayItCore
      - target: SayItBackend
      - target: SayItHTTP
      - target: SayItProtocol
      - package: Hummingbird
        product: HummingbirdTesting
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
        PRODUCT_BUNDLE_IDENTIFIER: sh.sayit.mac.http-tests

  SayItUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: Tests/SayItUITests
    dependencies:
      - target: SayIt
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
        PRODUCT_BUNDLE_IDENTIFIER: sh.sayit.mac.ui-tests
        TEST_TARGET_NAME: SayIt

schemes:
  SayIt:
    build:
      targets:
        SayIt: all
        SayItCoreTests: [test]
        SayItProtocolTests: [test]
        SayItBackendTests: [test]
        SayItHTTPTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - SayItCoreTests
        - SayItProtocolTests
        - SayItBackendTests
        - SayItHTTPTests
        - SayItUITests
    archive:
      config: Release
